<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles.css">
  <title>Sign-Up Form</title>
</head>
<body>
  <div class="content">
    <div class="left">
      <img src="./src/images/banner.jpg" alt="Picture of Falls of the Neuse River in Wake Forrest take by Silas Schlax">
      <div class="overlay">
          <div class="background"></div>
          <img src="./src/images/odin-lined.png" alt="The Odin Project Logo lined">
          <h1>ODIN</h1>
        </div>
        <p class="disclaimer">Photo by Silas Schlax</p>
    </div>
    <div class="right">
        <div class="intro">
          <h3>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sing up <em>now</em> to get started.</h3>
          <h3>You <em>know</em> you want to.</h3>
        </div>
        <form action="#" method="post">
          <div class="inputs-ctr">
            <legend>Let's do this!</legend>
            <div class="groups">
              <div class="group" id="1">
                <label for="name-first">First Name</label>
                <input type="text" name="name-first" id="name-first" placeholder="George" minlength="3" maxlength="20" required>

                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="name@company.com" required>

                <label for="password">Password</label>
                <input type="password" name="password" id="password" minlength="8" maxlength="25" required>
              </div>
              <div class="group" id="2">
                <label for="name-last">Last Name</label>
                <input type="text" name="name-last" id="name-last" placeholder="Washington" minlength="3" maxlength="20" required>

                <label for="phone-num">Phone Number</label>
                <input type="number" name="phone-num" id="phone-num" placeholder="0123456789" minlength="10" maxlength="11">

                <label for="confirm-password">Confirm Password</label>
                <input type="password" name="confirm-password" id="confirm-password" minlength="8" maxlength="25" required>
              </div>
            </div>
          </div>
          <button class="submit" type="submit">Create Account</button>
        </form>
        <p>Already have an account? <a href="#">Log in</a></p>
    </div>
  </div>
</body>
</html>
